name: Replay check

# Every push and pull request: run the engine tests, then the same `npm run build` the
# hosting runs (typecheck, play back the reference solution of every hole, SPEC v3 2.9,
# and bundle). The production deploy is gated separately: `npm run build` runs the
# replay check itself, so the hosting build fails, and nothing goes live, when a hole
# is broken. Running the bundling here too keeps a build error from showing up only
# on the host.
on:
  push:
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
